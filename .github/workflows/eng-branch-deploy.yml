name: Deploy engineer branch to their namespace (edge)

# Push to eng/<name> builds this branch's metafore-edge image and deploys it
# into the engineer's eng-<name> namespace on one shared cluster (edge tag =
# branch SHA; core/ui stay at the stable baseline). Namespace model — one
# cluster, many isolated environments. Mirrors metafore-core's workflow.
on:
  push:
    branches:
      - 'eng/**'

concurrency:
  group: eng-deploy-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REGISTRY: 359469026479.dkr.ecr.us-east-1.amazonaws.com
      AWS_REGION: us-east-1
      SHARED_CLUSTER: metafore-preview
    steps:
      - name: Derive engineer name, namespace, image tag from the branch
        id: vars
        run: |
          NAME="${GITHUB_REF#refs/heads/eng/}"
          NAME="${NAME//\//-}"
          echo "name=$NAME"            >> "$GITHUB_OUTPUT"
          echo "ns=eng-${NAME}"        >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Checkout metafore-edge
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Checkout metafore-platform (Helm chart)
        uses: actions/checkout@v4
        with:
          repository: ilansehayekCA/metafore-platform
          ref: main
          path: _platform
          token: ${{ secrets.GH_PAT }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build + push the branch's edge image
        run: |
          IMG="$ECR_REGISTRY/metafore-ilan/metafore-edge:${{ steps.vars.outputs.tag }}"
          docker build -t "$IMG" .
          docker push "$IMG"

      - name: Tooling (helm)
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Install kubectl + dig
        run: |
          curl -sLO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          sudo apt-get update -y && sudo apt-get install -y dnsutils

      - name: Point kubectl at the shared cluster
        run: aws eks update-kubeconfig --name "$SHARED_CLUSTER" --region "$AWS_REGION"

      - name: Resolve ingress NLB IP -> nip.io host
        id: host
        run: |
          LB=$(kubectl get svc ingress-nginx-controller -n ingress-nginx \
                 -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          IP=$(dig +short "$LB" | grep -E '^[0-9]+\.' | sort -V | head -1)
          if [ -z "$IP" ]; then echo "::error::could not resolve NLB IP for $LB"; exit 1; fi
          echo "host=${{ steps.vars.outputs.name }}.${IP}.nip.io" >> "$GITHUB_OUTPUT"

      - name: Deploy (helm upgrade --install — edge tag = branch, baseline otherwise)
        run: |
          helm upgrade --install metafore _platform/infra/helm/metafore-platform \
            -n "${{ steps.vars.outputs.ns }}" --create-namespace \
            --set createNamespace=false \
            --set extraEdges.enabled=false \
            --set emqx.externalBroker.enabled=false \
            --set isolation.enabled=true \
            --set ingress.host="${{ steps.host.outputs.host }}" \
            --set ingress.tls.enabled=true \
            --set ingress.tls.clusterIssuer=letsencrypt-http01 \
            --set edge.tag="${{ steps.vars.outputs.tag }}" \
            --set core.env.MCP_API_KEY="${{ secrets.MCP_API_KEY }}" \
            --set core.env.ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            --set neo4j.heapSize=512m --set neo4j.pageCacheSize=512m \
            --set neo4j.memoryRequest=1Gi --set neo4j.memoryLimit=2Gi --set neo4j.cpuRequest=250m \
            --timeout 12m
          kubectl rollout status deploy/metafore-edge -n "${{ steps.vars.outputs.ns }}" --timeout=300s

      - name: Summary
        run: |
          echo "### ✅ Deployed edge \`${{ steps.vars.outputs.tag }}\` to namespace **${{ steps.vars.outputs.ns }}** on **$SHARED_CLUSTER**" >> "$GITHUB_STEP_SUMMARY"
          echo "🔗 https://${{ steps.host.outputs.host }}" >> "$GITHUB_STEP_SUMMARY"
