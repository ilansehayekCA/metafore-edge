name: CI/CD — metafore-edge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Slice 33.1.0: tests re-enabled. The pre-existing
    # ``mariadb`` service is no longer needed (PostgreSQL migration
    # 2026-04-12 dropped MariaDB everywhere; the test fixture rot
    # that referenced it was fixed in this slice). The ``mosquitto``
    # service remains for any future Camel-MQTT integration test.
    services:
      mosquitto:
        image: eclipse-mosquitto:2
        ports:
          - 1883:1883

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build + run unit tests
        # Slice 33.1.0 re-enabled the test suite. The previous
        # ``-Dmaven.test.skip=true`` skipped the entire suite due to
        # a single broken file (RestAdapterRouteTest.java —
        # Version FQN + IOException-throws mismatch) and one stale
        # fixture (EdgeConfigTest dbPort 3306 → 5432 PostgreSQL
        # migration). Both fixed in this slice; 82/82 tests green
        # as of the commit that removed this skip flag.
        run: mvn package -B

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          docker build -t $ECR_REGISTRY/metafore-ilan/metafore-edge:${{ github.sha }} .
          docker build -t $ECR_REGISTRY/metafore-ilan/metafore-edge:latest .
          docker push $ECR_REGISTRY/metafore-ilan/metafore-edge:${{ github.sha }}
          docker push $ECR_REGISTRY/metafore-ilan/metafore-edge:latest
        env:
          ECR_REGISTRY: 359469026479.dkr.ecr.us-east-1.amazonaws.com

      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name metafore-ilan-project-dev --region us-east-1
          kubectl rollout restart deployment/metafore-edge -n metafore
