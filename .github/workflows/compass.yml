name: Compass
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  pull-requests: write
  contents: read
  statuses: write

jobs:
  compass-drift:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Compass drift check
        env:
          COMPASS_URL: https://campass-btv.up.railway.app
          COMPASS_API_KEY: ${{ secrets.COMPASS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "${COMPASS_URL}/webhook/github" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${COMPASS_API_KEY}" \
            -H "X-GitHub-Token: ${GITHUB_TOKEN}" \
            -d "{\"pr_number\":${PR_NUMBER},\"repo\":\"${REPO}\",\"sha\":\"${SHA}\",\"merged\":false}"

  auto-mark-on-merge:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: POST merge event to Compass webhook
        env:
          COMPASS_URL: https://campass-btv.up.railway.app
          COMPASS_API_KEY: ${{ secrets.COMPASS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR_EMAIL: ${{ github.event.pull_request.user.email }}
          AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "${COMPASS_URL}/webhook/github" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${COMPASS_API_KEY}" \
            -H "X-GitHub-Token: ${GITHUB_TOKEN}" \
            -d "{\"pr_number\":${PR_NUMBER},\"repo\":\"${REPO}\",\"sha\":\"${SHA}\",\"merged\":true,\"pr_author_email\":\"${AUTHOR_EMAIL}\",\"pr_author_login\":\"${AUTHOR_LOGIN}\"}"
